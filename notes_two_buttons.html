<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>筆記分享連結工具</title>
<style>
:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color-scheme:light dark}
body{max-width:670px;margin:48px auto;padding:0 20px;line-height:1.6}
label{display:block;font-weight:650;margin-top:18px}
input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #9ba4ae;border-radius:8px;font-size:16px}
button{cursor:pointer;padding:12px 18px;border:0;border-radius:8px;font-size:16px;background:#1e60c9;color:white;margin-top:20px}
button:disabled{opacity:.5}
small,.muted{color:#737d89}
#error{color:#b3261e;font-weight:650}
#linkarea{overflow-wrap:anywhere;margin-top:16px;padding:12px;background:rgba(127,127,127,.1);border-radius:8px}
a{overflow-wrap:anywhere}
#visitor .actions{display:flex;gap:12px;flex-wrap:wrap}
#visitor .actions button{margin-top:12px}
#back{background:#6b7280}
</style>
</head>
<body>
<section id="setup">
<h1>單次點擊雙網址工具</h1>
<p>設定網站 B 和 PDF 網址 C，產生分享連結 A。訪客在 A 點擊繼續後，瀏覽器將嘗試在新分頁開啟 B，並使原分頁前往 C。</p>
<label for="b">網站 B（新分頁）</label>
<input id="b" type="url" placeholder="https://example.com" autocomplete="off">
<label for="c">網站 C（PDF／最終頁面）</label>
<input id="c" type="url" placeholder="https://example.com/notes.pdf" autocomplete="off">
<button id="create">產生分享連結 A</button>
<p id="error" role="alert"></p>
<div id="linkarea" hidden><strong>分享連結 A</strong><p><a id="out" target="_blank" rel="noopener noreferrer"></a></p><button id="copy" type="button">複製連結</button></div>
<p class="muted"><small>公開分享時，請先將此 HTML 放到 GitHub Pages。部分瀏覽器可能阻擋新分頁。</small></p>
</section>
<section id="visitor" hidden>
<h1>請選擇是否繼續</h1>
<p>「繼續」會開啟參考網站與筆記，這不是真正的人機驗證。</p>
<div class="actions">
<button id="go" type="button">我不是機器人，繼續</button>
<button id="back" type="button">返回</button>
</div>
<p id="status" role="status"></p>
</section>
<script>
(function(){
  'use strict';
  const $ = id => document.getElementById(id);
  function safe(s){try{const u=new URL(s);return ['http:','https:'].includes(u.protocol)?u:null}catch{return null}}
  const query=new URLSearchParams(location.search);
  if(query.get('mode')==='go'){
    $('setup').hidden=true;
    $('visitor').hidden=false;
    const b=safe(query.get('b')),c=safe(query.get('c'));
    if(!b||!c){$('status').textContent='網址參數無效，請重新產生分享連結。';$('go').disabled=true;}
    else {
      $('go').addEventListener('click',()=>{
        window.open(b.href,'_blank','noopener,noreferrer');
        location.assign(c.href);
      });
    }
    $('back').addEventListener('click',()=>{
      if(history.length>1){history.back();}
      else {const u=new URL(location.href);u.search='';u.hash='';location.replace(u.href);}
    });
  } else {
    $('create').addEventListener('click',()=>{
      const b=safe($('b').value.trim()),c=safe($('c').value.trim());
      if(!b||!c){$('error').textContent='請填入兩條有效的 http(s) 網址。';return;}
      $('error').textContent='';
      const u=new URL(location.href);u.search='';u.hash='';
      u.searchParams.set('mode','go');u.searchParams.set('b',b.href);u.searchParams.set('c',c.href);
      $('out').href=u.href;$('out').textContent=u.href;$('linkarea').hidden=false;
    });
    $('copy').addEventListener('click',async()=>{
      const value=$('out').href;
      try{await navigator.clipboard.writeText(value);$('copy').textContent='已複製';}
      catch{window.prompt('複製以下連結',value);}
    });
  }
})();
</script>
</body>
</html>
