<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>筆記雙網址導流工具 v4</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{background:#0c1220;color:#f1f5ff;font:16px/1.6 system-ui,'Noto Sans TC',sans-serif;margin:0}.wrap{max-width:760px;margin:30px auto;padding:0 16px}h1{font-size:26px;line-height:1.3}h2{font-size:19px}.panel{border:1px solid #334158;background:#192438;padding:22px;border-radius:14px;margin:15px 0}label{display:block;font-weight:700;margin:15px 0 6px}input{font:inherit;width:100%;padding:12px;border:1px solid #8b9ab0;border-radius:8px;background:#0c1626;color:#fff}button,a.action{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:11px 16px;background:#8ca9ff;color:#081323;font-weight:700;text-decoration:none;display:inline-block;margin:8px 6px 4px 0}.secondary{background:#3d516e!important;color:#fff!important}.hint{font-size:13px;color:#b8c6dc}.alert{white-space:pre-wrap;font-weight:600;padding:10px 12px;border-radius:8px;background:#24354d;margin-top:12px}.error{background:#47272f;color:#ffe4e7}.success{background:#234036;color:#d9ffe9}.url{background:#07111e;border:1px solid #394a67;border-radius:8px;padding:12px;overflow-wrap:anywhere}.hidden{display:none}#count{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums}a{color:#bcd1ff}
</style></head><body><main class="wrap"><h1>筆記雙網址導流工具 <small>v4</small></h1><p class="hint">已修正按鈕無反應問題：操作一定會回報結果或錯誤。合作網址採自願點擊；下載頁可設定同分頁倒數。</p>
<section class="panel" id="builder"><h2>建立連結</h2><form id="builderForm" novalidate><label for="partner">你的轉接／合作網站網址（選填）</label><input id="partner" type="text" inputmode="url" placeholder="https://example.com/consent"><label for="target">最終 PDF 預覽網址（必填）</label><input id="target" type="text" inputmode="url" placeholder="https://rex941024.github.io/notes/note.pdf" required><label for="delay">前往 PDF 前倒數秒數（0–120）</label><input id="delay" type="number" value="3" min="0" max="120" step="0.5"><label for="note">筆記名稱（選填）</label><input id="note" placeholder="AI 摘要筆記"><div><button type="submit">產生分享連結</button><button type="button" id="test" class="secondary">本機測試流程</button></div></form><div id="status" role="status" aria-live="polite" class="alert">已載入，請填寫 PDF 網址後操作。</div><div id="result" class="hidden"><p><b>分享連結</b></p><div class="url" id="share"></div><button type="button" id="copy">複製網址</button><a class="action secondary" id="open" target="_blank" rel="noopener">以新分頁測試</a><p class="hint" id="hosting"></p></div></section>
<section class="panel hidden" id="viewer"><h2 id="viewTitle">AI 摘要筆記</h2><p>您可以免費開啟筆記；如願意支持整理工作，也可以自願造訪合作網站。</p><p id="partnerArea" class="hidden"><a id="partnerLink" class="action secondary" target="_blank" rel="noopener noreferrer">自願前往合作網站</a></p><div id="count">3.0 秒</div><p class="hint">倒數結束會在同一分頁開啟 PDF。</p><button id="go" type="button">立即前往 PDF</button><button id="stop" class="secondary" type="button">取消倒數</button><div id="viewStatus" role="status" aria-live="polite" class="alert">已進入筆記頁。</div></section><p class="hint">如在 ChatGPT 檔案預覽器中點擊按鈕沒有反應，請先「下載 HTML」，再使用 Chrome 開啟；檔案預覽器可能限制 JavaScript。</p></main>
<script>
(function(){'use strict';
const $=id=>document.getElementById(id);const query=new URLSearchParams(location.search);const view=query.get('mode')==='view';
const message=(id,msg,err=false,ok=false)=>{const el=$(id);el.textContent=msg;el.className='alert'+(err?' error':ok?' success':'')};
function url(s,optional=false){s=String(s||'').trim();if(!s&&optional)return '';if(!s)throw Error('請填入最終 PDF 網址');let u;try{u=new URL(s)}catch(_){throw Error('網址格式無效：請貼上完整 https:// 開頭的網址')}if(u.protocol!=='https:'&&u.protocol!=='http:')throw Error('只支援 http:// 或 https:// 網址');if(u.username||u.password)throw Error('網址不可包含帳號密碼');return u.href}
function delay(s){if(String(s).trim()==='')throw Error('請填入倒數秒數');const n=Number(s);if(!Number.isFinite(n)||n<0||n>120)throw Error('秒數請設定在 0–120 之間');return n}
function create(){const target=url($('target').value);const p=url($('partner').value,true);const d=delay($('delay').value);const params=new URLSearchParams({mode:'view',next:target,delay:String(d)});if(p)params.set('partner',p);if($('note').value.trim())params.set('title',$('note').value.trim().slice(0,120));return location.href.split('#')[0].split('?')[0]+'?'+params}
function generate(){try{const link=create();$('share').textContent=link;$('open').href=link;$('result').classList.remove('hidden');message('status','分享網址已產生。可點「以新分頁測試」。',false,true);$('hosting').textContent=location.protocol==='file:'?'注意：file:// 本機連結只有你自己的裝置能開啟。要分享請把本 HTML 上傳到 HTTPS 主機。':'網址使用目前頁面的位置，請先確認此網址能被其他人存取。';return link}catch(e){$('result').classList.add('hidden');message('status','無法產生：'+e.message,true);return null}}
function showView(){try{const target=url(query.get('next'));const partner=url(query.get('partner'),true);const d=delay(query.get('delay')??'3');$('builder').classList.add('hidden');$('viewer').classList.remove('hidden');$('viewTitle').textContent=(query.get('title')||'AI 摘要筆記').slice(0,120);if(partner){$('partnerLink').href=partner;$('partnerArea').classList.remove('hidden')}let timer=null;const finish=()=>{if(timer)clearInterval(timer);location.assign(target)};$('go').onclick=finish;$('stop').onclick=()=>{if(timer)clearInterval(timer);timer=null;$('count').textContent='倒數已取消';message('viewStatus','你仍可按「立即前往 PDF」。')};const deadline=performance.now()+d*1000;const refresh=()=>{const sec=Math.max(0,(deadline-performance.now())/1000);$('count').textContent=sec.toFixed(1)+' 秒';if(sec===0)finish()};refresh();if(d>0)timer=setInterval(refresh,100)}catch(e){$('builder').classList.add('hidden');$('viewer').classList.remove('hidden');$('go').disabled=true;$('stop').disabled=true;message('viewStatus','無法開啟：'+e.message,true)}}
try{if(view){showView()}else{$('builderForm').addEventListener('submit',e=>{e.preventDefault();generate()});$('test').addEventListener('click',()=>{const link=generate();if(link){message('status','測試模式：正在進入倒數頁…',false,true);location.assign(link)}});$('copy').addEventListener('click',async()=>{const s=$('share').textContent;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(s)}else{const el=document.createElement('textarea');el.value=s;document.body.appendChild(el);el.select();if(!document.execCommand('copy'))throw Error('瀏覽器拒絕複製');el.remove()}message('status','網址已複製。',false,true)}catch(e){message('status','無法自動複製，請長按網址手動複製。',true)}});}}catch(e){message('status','工具啟動失敗：'+e.message,true)}
})();
</script></body></html>
