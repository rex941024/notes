<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>筆記導流工具 v5</title><style> :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101625;color:#ecf2ff;font:16px/1.55 system-ui,'Noto Sans TC',sans-serif}.wrap{max-width:720px;margin:32px auto;padding:0 16px}.card{background:#1d293c;border:1px solid #3a4b65;border-radius:16px;padding:22px;margin:16px 0}h1{font-size:25px}h2{font-size:18px;margin-top:0}label{display:block;margin:15px 0 6px;font-weight:650}input{width:100%;padding:12px;background:#101a2a;color:#fff;border:1px solid #8190a8;border-radius:8px;font:inherit}button{border:0;border-radius:9px;background:#aac0ff;color:#102035;padding:12px 15px;margin:14px 8px 6px 0;font:inherit;font-weight:700;cursor:pointer}.secondary{background:#425573;color:#fff}.muted{font-size:13px;color:#bdc8dc}.result{padding:12px;background:#0c1525;overflow-wrap:anywhere;border:1px solid #425573;border-radius:9px}.hidden{display:none}.error{color:#ffd1d8}.notice{color:#d8ecff}</style></head><body><main class="wrap"><section class="card" id="editor"><h1>筆記導流工具 v5</h1><p class="muted">只產生導往你既有分流站的網址。分流站負責使用者同意與回跳；此工具不另設下載按鈕、合作按鈕或顯示倒數。</p><form id="form"><label for="station">分流站 HTTPS 網址（必填）</label><input id="station" required placeholder="https://your-domain.com/redirect" inputmode="url"><label for="target">最終 PDF／網盤網址（必填）</label><input id="target" required placeholder="https://rex941024.github.io/notes/note.pdf" inputmode="url"><label for="seconds">分流站回跳的等待秒數（0–120）</label><input id="seconds" type="number" value="3" min="0" max="120" step="0.5"><details><summary>進階設定：修改分流站接收的參數名稱</summary><label for="nextkey">目標網址參數名稱</label><input id="nextkey" value="next"><label for="delaykey">秒數參數名稱</label><input id="delaykey" value="delay"></details><button type="submit">產生分享連結</button><button id="test" type="button" class="secondary">測試打開分流站</button></form><p id="status" role="status" aria-live="polite" class="muted">尚未產生連結。</p><div id="result" class="hidden"><div class="result" id="link"></div><button type="button" id="copy">複製分享連結</button></div><p class="muted">如果分流站尚未支援 next / delay，請修改該站程式；本站不能在跳入第三方網站後，代替它控制回跳時間。</p></section></main><script>
(()=>{'use strict';const e=id=>document.getElementById(id);const out=(s,bad=false)=>{e('status').textContent=s;e('status').className=bad?'error':'notice'};function absolute(text){let u;try{u=new URL(text.trim())}catch{throw Error('請輸入完整的 https:// 網址')}if(u.protocol!=='https:'&&u.protocol!=='http:')throw Error('只接受 http(s) 網址');if(u.username||u.password)throw Error('網址不能包含帳號密碼');return u}function key(text){const k=text.trim();if(!/^[A-Za-z][A-Za-z0-9_-]{0,39}$/.test(k))throw Error('參數名稱只能用英文字母、數字、底線或減號');return k}function make(){const station=absolute(e('station').value),target=absolute(e('target').value);const seconds=Number(e('seconds').value);if(e('seconds').value.trim()===''||!Number.isFinite(seconds)||seconds<0||seconds>120)throw Error('秒數必須介於 0–120');const n=key(e('nextkey').value),d=key(e('delaykey').value);if(n===d)throw Error('兩個參數名稱不能一樣');station.searchParams.set(n,target.href);station.searchParams.set(d,String(seconds));return station.href}function generate(){try{const link=make();e('link').textContent=link;e('result').classList.remove('hidden');out('連結已產生。請確認分流站支援回跳參數。');return link}catch(err){e('result').classList.add('hidden');out('錯誤：'+err.message,true);return null}}e('form').addEventListener('submit',ev=>{ev.preventDefault();generate()});e('test').addEventListener('click',()=>{const link=generate();if(link)location.assign(link)});e('copy').addEventListener('click',async()=>{try{const link=e('link').textContent;if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(link);else{const ta=document.createElement('textarea');ta.value=link;document.body.appendChild(ta);ta.select();if(!document.execCommand('copy'))throw Error('無法存取剪貼簿');ta.remove()}out('已複製。')}catch{out('自動複製失敗：請長按產生的網址複製。',true)}})})();
</script></body></html>
